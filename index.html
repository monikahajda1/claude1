<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ede2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Mój Trening</title>
<style>
:root{
  --bg:#f5ede2; --card:#fffaf3; --beige:#ecdfcd; --beige2:#dcc6a8;
  --brown:#7b5235; --brown-d:#4b3020; --caramel:#b9814f; --text:#3a281b;
  --muted:#8a715c; --ok:#6f8b4a; --line:#e4d5c1; --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:21px;margin:22px 0 10px}
h3{font-size:18px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Pasek górny */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:22px;color:var(--brown-d);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:48px;height:48px;border:0;border-radius:14px;background:var(--beige);font-size:28px;line-height:1;color:var(--brown-d);display:flex;align-items:center;justify-content:center}
.back[hidden]{display:none}

main{padding:12px 16px calc(100px + var(--safe-b));max-width:680px;margin:0 auto}

/* Dolne menu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -4px 16px rgba(75,48,32,.06)}
.tabbar button{border:0;background:none;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
.tabbar svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brown-d);font-weight:600}
.tabbar button.on svg{stroke:var(--brown)}

/* Karty i przyciski */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(75,48,32,.06);border:1px solid var(--line)}
.card.tap{display:block;width:100%;text-align:left;border:1px solid var(--line)}
.card.tap:active{transform:scale(.99);background:#fbf3e8}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--brown);color:#fff;font-size:18px;font-weight:600;padding:12px 18px;margin:10px 0;text-decoration:none}
.btn:active{background:var(--brown-d)}
.btn.sec{background:var(--beige);color:var(--brown-d)}
.btn.sec:active{background:var(--beige2)}
.btn.ok{background:var(--ok)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--beige2);background:var(--card);border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px;color:var(--brown-d)}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.tag{display:inline-block;background:var(--beige);color:var(--brown-d);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0}
.hero{background:linear-gradient(135deg,#8a5d3d,#b9814f);color:#fff;border:0}
.hero .muted{color:#f5e6d3}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* Ćwiczenia */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 8px rgba(75,48,32,.05)}
.excard:active{transform:scale(.98)}
.exname{font-weight:600;font-size:16px;line-height:1.25;margin-top:4px;color:var(--brown-d)}
.fig{display:block;width:100%;border-radius:12px;background:#f8efe3}
.fig.thumb{height:110px}
.fig.big{height:250px}
.figcard{padding:8px}
.steps,.good,.bad{padding-left:0;list-style:none;margin:0}
.steps{counter-reset:s}
.steps li,.good li,.bad li{position:relative;padding:10px 12px 10px 48px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--brown);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.good li::before,.bad li::before{position:absolute;left:12px;top:9px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.good li::before{content:"✓";background:#e3ead3;color:var(--ok)}
.bad li::before{content:"✕";background:#f3dcd3;color:#a4553a}
</style>
</head>
<body>
<header class="topbar">
  <button class="back" id="backBtn" hidden aria-label="Wstecz">‹</button>
  <h1 id="title">Mój Trening</h1>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Dziś</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10l5-2 5 2M9 21l3-7 3 7"/></svg>Ćwiczenia</button>
  <button data-tab="workouts"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Treningi</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Dziennik</button>
</nav>

<script>
'use strict';
/* =========================================================
   POMOCNICZE
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const DNI_KR = ['Nd','Pn','Wt','Śr','Cz','Pt','So'];
const MIESIACE = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MIESIACE_D = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const fmtDate = d => `${d.getDate()} ${MIESIACE_D[d.getMonth()]}`;

const actions = {};   // akcje przycisków (data-act)
const store = {
  get(k, def) { try { const v = localStorage.getItem('mt_' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('mt_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* =========================================================
   ANIMOWANA SYLWETKA (SVG)
   Kąty w stopniach: 0 = w dół, 90 = do przodu (w prawo), 180 = w górę, -90 = do tyłu.
   t – tułów (od bioder do szyi), n – głowa, ua/fa – ramię/przedramię,
   th/sh – udo/łydka, f – stopa, c – wygięcie kręgosłupa, y – uniesienie (skok).
   1 = bliższa strona (ciemniejsza), 2 = dalsza (jaśniejsza).
   ========================================================= */
const FIG = { torso:52, ua:26, fa:25, th:42, sh:40, foot:11, head:10, sw:11, hw:7 };
const BASE_POSE = { t:180, n:null, c:0, ua1:6, fa1:12, ua2:-6, fa2:-2, th1:3, sh1:2, th2:-3, sh2:-3, f1:null, f2:null, y:0 };
const POSE_KEYS = Object.keys(BASE_POSE);
const vec = (a, len) => { const r = a * Math.PI / 180; return [Math.sin(r) * len, Math.cos(r) * len]; };
const addv = (a, b) => [a[0] + b[0], a[1] + b[1]];

function poseJoints(p, front) {
  const [tx, ty] = vec(p.t, 1);
  const J = { hip:[0, 0], neck:[tx * FIG.torso, ty * FIG.torso] };
  J.head = addv(J.neck, vec(p.n, FIG.head + 3));
  const px = -ty, py = tx;            // kierunek prostopadły do tułowia (barki w widoku z przodu)
  J.ctrl = [J.neck[0] / 2 + ty * p.c, J.neck[1] / 2 - tx * p.c];
  for (const s of [1, 2]) {
    const m = front && s === 2 ? -1 : 1;           // w widoku z przodu lewa strona to lustro prawej
    const side = front ? (s === 1 ? 1 : -1) : 0;
    const v = (a, len) => { const [x, y] = vec(a, len); return [x * m, y]; };
    const sho = [J.neck[0] + px * FIG.sw * side, J.neck[1] + py * FIG.sw * side];
    const hp = [px * FIG.hw * side, py * FIG.hw * side];
    J['sho' + s] = sho;
    J['el' + s] = addv(sho, v(p['ua' + s], FIG.ua));
    J['ha' + s] = addv(J['el' + s], v(p['fa' + s], FIG.fa));
    J['hp' + s] = hp;
    J['kn' + s] = addv(hp, v(p['th' + s], FIG.th));
    J['an' + s] = addv(J['kn' + s], v(p['sh' + s], FIG.sh));
    J['to' + s] = addv(J['an' + s], v(p['f' + s], front ? 6 : FIG.foot));
  }
  return J;
}
const ANCHORS = { hip:'hip', toe1:'to1', toe2:'to2', hand1:'ha1', hand2:'ha2', knee1:'kn1', knee2:'kn2' };
function anchorX(J, a) { return a === 'feet' ? (J.to1[0] + J.to2[0]) / 2 : J[ANCHORS[a] || 'hip'][0]; }
function lowest(J) {
  let low = -Infinity;
  for (const k in J) { if (k === 'ctrl') continue; low = Math.max(low, J[k][1] + (k === 'head' ? FIG.head : 3.5)); }
  return low;
}
// Ustawia sylwetkę na podłodze (y = 0) i w stałym punkcie zaczepienia
function placePose(ex, p) {
  const A = ex.anim, J = poseJoints(p, A.front);
  let dx, dy;
  if (A.fix) { const a = J[ANCHORS[A.fix]]; dx = -a[0]; dy = A._fixY - a[1]; }
  else { dx = -anchorX(J, A.anchor); dy = -lowest(J) - (p.y || 0); }
  for (const k in J) J[k] = [J[k][0] + dx, J[k][1] + dy];
  return J;
}
function normPose(p) {
  const q = { ...BASE_POSE, ...p };
  if (q.n == null) q.n = q.t;
  if (q.f1 == null) q.f1 = q.sh1 + 90;
  if (q.f2 == null) q.f2 = q.sh2 + 90;
  return q;
}
function interpPose(a, b, k) { const o = {}; for (const key of POSE_KEYS) o[key] = a[key] + (b[key] - a[key]) * k; return o; }

function prepAnim(ex) {
  const A = ex.anim;
  if (A._k) return A;
  A._k = A.frames.map(f => ({ pose: normPose({ ...A.base, ...f }), d: f.d || A.d || 900, h: f.h ?? A.h ?? 250 }));
  if (A.fix) { const J0 = poseJoints(A._k[0].pose, A.front); A._fixY = J0[ANCHORS[A.fix]][1] - lowest(J0); }
  A._total = A._k.reduce((s, f) => s + f.d + f.h, 0);
  // obszar rysunku – obejmuje wszystkie pozy i stany pośrednie
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = 6;
  for (let i = 0; i < A._k.length; i++) for (const k of [0, .5]) {
    const p = interpPose(A._k[i].pose, A._k[(i + 1) % A._k.length].pose, k);
    const J = placePose(ex, p);
    for (const key in J) {
      if (key === 'ctrl') continue;
      const r = key === 'head' ? FIG.head : 4;
      x0 = Math.min(x0, J[key][0] - r); x1 = Math.max(x1, J[key][0] + r);
      y0 = Math.min(y0, J[key][1] - r); y1 = Math.max(y1, J[key][1] + r);
    }
  }
  if (A.props && A.props.includes('wall')) x0 -= 10;
  if (A.props && A.props.includes('chair')) x0 -= 34;
  let w = x1 - x0 + 24, h = y1 - y0 + 24;
  const minW = 170, minH = 130;
  if (w < minW) { x0 -= (minW - w) / 2; w = minW; }
  if (h < minH) { y0 -= (minH - h) - 6; h = minH; }
  if (w / h < 1.15) { const nw = h * 1.15; x0 -= (nw - w) / 2; w = nw; }
  A._vb = [x0 - 12, y0 - 12, w, h];
  return A;
}

const pt = p => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
function figPaths(J, front) {
  const o = {
    arm1: `M${pt(J.sho1)}L${pt(J.el1)}L${pt(J.ha1)}`,
    arm2: `M${pt(J.sho2)}L${pt(J.el2)}L${pt(J.ha2)}`,
    leg1: `M${pt(J.hp1)}L${pt(J.kn1)}L${pt(J.an1)}L${pt(J.to1)}`,
    leg2: `M${pt(J.hp2)}L${pt(J.kn2)}L${pt(J.an2)}L${pt(J.to2)}`,
    torso: `M${pt(J.hip)}Q${pt(J.ctrl)} ${pt(J.neck)}` + (front ? `M${pt(J.sho2)}L${pt(J.sho1)}M${pt(J.hp2)}L${pt(J.hp1)}` : '')
  };
  return o;
}
function propsSVG(ex) {
  const A = ex.anim; if (!A.props) return '';
  const J = placePose(ex, A._k[0].pose); let s = '';
  if (A.props.includes('wall')) {
    const x = Math.min(J.hip[0], J.neck[0], J.head[0] - FIG.head) - 6;
    s += `<rect x="${x - 10}" y="-200" width="10" height="200" fill="#e3d2bb"/>`;
  }
  if (A.props.includes('chair')) {
    const hx = J.ha1[0], hy = J.ha1[1] + 4;
    s += `<rect x="${hx - 34}" y="${hy}" width="40" height="6" rx="2" fill="#c9a37c"/>` +
         `<rect x="${hx - 32}" y="${hy}" width="5" height="${-hy}" fill="#c9a37c"/><rect x="${hx - 1}" y="${hy}" width="5" height="${-hy}" fill="#c9a37c"/>` +
         `<rect x="${hx - 34}" y="${hy - 34}" width="5" height="34" fill="#c9a37c"/>`;
  }
  return s;
}
let figUid = 0;
function figureSVG(ex, opts = {}) {
  const A = prepAnim(ex);
  const fi = Math.min(opts.frame ?? 0, A._k.length - 1);
  const J = placePose(ex, A._k[fi].pose), P = figPaths(J, A.front);
  const [x, y, w, h] = A._vb;
  const id = 'f' + (++figUid);
  return `<svg class="fig ${opts.cls || ''}" viewBox="${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" data-fig="${ex.id}" ${opts.animate ? 'data-anim="1"' : ''} preserveAspectRatio="xMidYMax meet" aria-label="Animacja: ${esc(ex.name)}">
    <rect x="${x - 50}" y="3" width="${w + 100}" height="${h}" fill="#efe2d0"/>
    <line x1="${x - 50}" y1="3" x2="${x + w + 50}" y2="3" stroke="#d6bf9f" stroke-width="2"/>
    ${A.mat ? `<rect x="${x + 8}" y="0" width="${w - 16}" height="4" rx="2" fill="#c9a37c"/>` : ''}
    ${propsSVG(ex)}
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path data-p="arm2" d="${P.arm2}" stroke="${A.front ? '#6b4630' : '#c4a07e'}" stroke-width="7"/>
      <path data-p="leg2" d="${P.leg2}" stroke="${A.front ? '#6b4630' : '#c4a07e'}" stroke-width="8"/>
      <path data-p="torso" d="${P.torso}" stroke="#5b3a26" stroke-width="9"/>
      <circle data-p="head" cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="${FIG.head}" fill="#5b3a26"/>
      <path data-p="leg1" d="${P.leg1}" stroke="#5b3a26" stroke-width="8"/>
      <path data-p="arm1" d="${P.arm1}" stroke="#5b3a26" stroke-width="7"/>
    </g></svg>`;
}

// Pętla animacji – jedna dla wszystkich widocznych sylwetek
const liveFigs = [];
let figRaf = 0;
const ease = k => 0.5 - Math.cos(Math.PI * k) / 2;
function mountFigures(root, reset = true) {
  if (reset) liveFigs.length = 0;
  root.querySelectorAll('svg[data-anim]').forEach(svg => {
    const ex = EX_BY_ID[svg.dataset.fig]; if (!ex) return;
    const parts = {}; svg.querySelectorAll('[data-p]').forEach(el => parts[el.dataset.p] = el);
    liveFigs.push({ svg, ex, parts, start: performance.now() });
  });
  if (liveFigs.length && !figRaf) figRaf = requestAnimationFrame(tickFigures);
}
function tickFigures(now) {
  for (let i = liveFigs.length - 1; i >= 0; i--) {
    const f = liveFigs[i];
    if (!f.svg.isConnected) { liveFigs.splice(i, 1); continue; }
    if (f.paused) continue;
    const A = f.ex.anim, K = A._k;
    let t = (now - f.start) % A._total, j = 0;
    while (t >= K[j].h + K[j].d) { t -= K[j].h + K[j].d; j++; }
    const k = t < K[j].h ? 0 : ease((t - K[j].h) / K[j].d);
    const J = placePose(f.ex, interpPose(K[j].pose, K[(j + 1) % K.length].pose, k));
    const P = figPaths(J, A.front);
    for (const key in P) f.parts[key].setAttribute('d', P[key]);
    f.parts.head.setAttribute('cx', J.head[0].toFixed(1)); f.parts.head.setAttribute('cy', J.head[1].toFixed(1));
  }
  figRaf = liveFigs.length ? requestAnimationFrame(tickFigures) : 0;
}

/* =========================================================
   BAZA ĆWICZEŃ
   ========================================================= */
const CATS = [
  { id:'brzuch', name:'Brzuch' }, { id:'posladki', name:'Pośladki' }, { id:'nogi', name:'Nogi' },
  { id:'gora', name:'Ramiona i plecy' }, { id:'cale', name:'Całe ciało' }, { id:'stretch', name:'Rozciąganie' }
];
// Pozycje wyjściowe wykorzystywane przez wiele ćwiczeń
const SUP = { t:-90, n:-90, ua1:90, fa1:90, ua2:88, fa2:88, th1:136, sh1:10, th2:132, sh2:7, f1:90, f2:90 };   // leżenie na plecach, nogi ugięte
const FOURS = { t:100, n:108, ua1:0, fa1:0, ua2:3, fa2:3, th1:0, sh1:-90, f1:-90, th2:3, sh2:-90, f2:-90 };   // klęk podparty
const HPLANK = { t:112, n:112, ua1:0, fa1:0, ua2:3, fa2:3, th1:-68, sh1:-68, th2:-69, sh2:-69 };             // podpór na prostych rękach
const STAND = { f1:90, f2:90 };
const CLASP = { ua1:22, fa1:-128, ua2:22, fa2:-128 };   // dłonie złączone przed klatką (widok z przodu)

const EXERCISES = [
  /* ---------------- BRZUCH ---------------- */
  { id:'brzuszki', cat:'brzuch', name:'Brzuszki (spięcia)', muscles:'mięsień prosty brzucha',
    levels:['Unosisz tylko głowę i barki o kilka centymetrów, ręce wzdłuż ciała.','Klasyczne spięcie – łopatki odrywają się od podłogi, ręce sięgają w stronę kolan.','Ręce skrzyżowane na klatce, 2 s pauzy w górze i powolne opuszczanie.'],

const EX_BY_ID = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
const catName = id => (CATS.find(c => c.id === id) || {}).name || '';

/* =========================================================
   WIDOKI
   ========================================================= */
let exCat = 'all';
const levelSel = {};
actions.cat = el => { exCat = el.dataset.cat; render(); };
actions.level = el => { levelSel[el.dataset.ex] = +el.dataset.lvl; renderLevels(el.dataset.ex); };
function renderLevels(id) {
  const ex = EX_BY_ID[id], l = levelSel[id] || 0;
  document.querySelectorAll('[data-act="level"]').forEach(b => b.classList.toggle('on', +b.dataset.lvl === l));
  $('#lvlText').textContent = ex.levels[l];
}
const LEVEL_NAMES = ['Łatwy', 'Średni', 'Trudny'];
const views = {
  today() {
    const d = new Date();
    return { title: 'Dziś', html: `
      <div class="card hero">
        <div class="muted small">${esc(DNI[d.getDay()])}, ${esc(fmtDate(d))}</div>
        <h2 style="margin:6px 0 4px">Cześć! 👋</h2>
        <p>Tu pojawi się Twój trening na dziś.</p>
      </div>
      <div class="empty">Etap 1 – szkielet aplikacji gotowy.</div>` };
  },
  exercises() {
    const list = EXERCISES.filter(e => exCat === 'all' || e.cat === exCat);
    return { title: 'Ćwiczenia', keepScroll: false, html: `
      <div class="chips">
        <button class="chip ${exCat === 'all' ? 'on' : ''}" data-act="cat" data-cat="all">Wszystkie (${EXERCISES.length})</button>
        ${CATS.map(c => `<button class="chip ${exCat === c.id ? 'on' : ''}" data-act="cat" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}
      </div>
      <div class="exgrid">
        ${list.map(e => `<button class="excard" data-go="#/exercise/${e.id}">
          ${figureSVG(e, { frame: 1, cls: 'thumb' })}
          <span class="exname">${esc(e.name)}</span>
          <span class="muted small">${esc(catName(e.cat))}</span>
        </button>`).join('')}
      </div>` };
  },
  exercise(id) {
    const ex = EX_BY_ID[id];
    if (!ex) return views.exercises();
    const l = levelSel[id] || 0;
    return { title: ex.name, html: `
      <div class="card figcard">${figureSVG(ex, { animate: true, cls: 'big' })}</div>
      <p><span class="tag">${esc(catName(ex.cat))}</span> <span class="muted small">Pracują: ${esc(ex.muscles)}</span></p>
      <h2>Poziom trudności</h2>
      <div class="row">${LEVEL_NAMES.map((n, i) => `<button class="chip ${i === l ? 'on' : ''}" data-act="level" data-ex="${id}" data-lvl="${i}">${i + 1}. ${n}</button>`).join('')}</div>
      <div class="card" id="lvlText">${esc(ex.levels[l])}</div>
      <h2>Jak wykonać</h2>
      <ol class="steps">${ex.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      <h2>Wskazówki</h2>
      <ul class="good">${ex.tips.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      <h2>Najczęstsze błędy</h2>
      <ul class="bad">${ex.mistakes.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` };
  },
  workouts() { return { title: 'Treningi', html: `<div class="empty">Gotowe treningi z timerem – etap 3.</div>` }; },
  plan() { return { title: 'Plan 8 tygodni', html: `<div class="empty">Plan tygodniowy – etap 4.</div>` }; },
  log() { return { title: 'Dziennik', html: `<div class="empty">Dziennik i kalendarz – etap 5.</div>` }; }
};

/* =========================================================
   ROUTER
   ========================================================= */
const TAB_OF = { today:'today', exercises:'exercises', exercise:'exercises', workouts:'workouts', workout:'workouts', plan:'plan', log:'log' };
const PARENT = { exercise:'#/exercises', workout:'#/workouts' };

function render() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  let name = parts[0] || 'today';
  if (!views[name]) name = 'today';
  const out = views[name](...parts.slice(1));
  $('#title').textContent = out.title;
  $('#view').innerHTML = out.html;
  $('#backBtn').hidden = !PARENT[name];
  $('#backBtn').dataset.go = PARENT[name] || '';
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB_OF[name]));
  mountFigures($('#view'));
  if (out.after) out.after();
  if (!out.keepScroll) window.scrollTo(0, 0);
}

// Delegacja kliknięć: data-go="#/..." przechodzi do widoku, data-act="nazwa" wywołuje akcję
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act],[data-tab]');
  if (!el) return;
  if (el.dataset.tab) { location.hash = '#/' + el.dataset.tab; return; }
  if (el.dataset.go) { location.hash = el.dataset.go; return; }
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});

window.addEventListener('hashchange', render);
render();

/* =========================================================
   PWA – service worker (działa tylko przez https / localhost)
   ========================================================= */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
