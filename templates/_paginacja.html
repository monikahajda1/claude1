{% load pomocnicze %}
{% if is_paginated %}
<nav class="mt-3"><ul class="pagination justify-content-center">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% zamien_param page=page_obj.previous_page_number %}">‹ Poprzednia</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Strona {{ page_obj.number }} z {{ paginator.num_pages }}</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% zamien_param page=page_obj.next_page_number %}">Następna ›</a></li>{% endif %}
</ul></nav>
{% endif %}
